name: goreleaser

on:
  push:
    tags:
      - "*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Install Qt6 rcc
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev-tools
          RCC=$(command -v rcc || true)
          if [ -z "$RCC" ]; then RCC=$(find /usr/lib/qt6 -name rcc -type f | head -n1); fi
          echo "Using rcc at: $RCC"
          echo "RCC=$RCC" >> "$GITHUB_ENV"
      - name: Build AppLoad console app
        run: |
          cd tools/appload-console
          ./build.sh
          cd build
          zip -r gms-console-RM2.zip gms-console
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
